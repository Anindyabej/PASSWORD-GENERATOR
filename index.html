<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=content_copy" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <h1 id="new-password"></h1>
        <span id="copy-btn" class="material-symbols-outlined">
            content_copy
        </span>
        <p id="copy-message"></p>
        <br>
        <input type="range" name="" id="range" min="6" max="20" value="10">
        
        <p id="slider"></p>

        <div>
            <input type="checkbox" id="upper-case" name="upper-case">
            <label for="upper-case">Uppercase</label>
            <br>
            <input type="checkbox" id="lower-case" name="lower-case">
            <label for="lower-case">Lowercase</label>
            <br>
            <input type="checkbox" id="number" name="number">
            <label for="number">Number</label>
            <br>
            <input type="checkbox" id="symbol" name="symbol">
            <label for="symbol">Symbol</label>
            <br>
        </div>

        <button id="button">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
